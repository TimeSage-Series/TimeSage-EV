  description: Report acknowledges the trailing-12 window rule (e.g. cites the 11-prior-month comparison
    or shows the current month load_factor alongside trailing-window context).
  answer_field: null
  question_tag: B6
  verification_question: Does the report cite the trailing-12-month strict-maximum rule or show the current
    load_factor alongside trailing context?
  answer_type: boolean
