method: llm_judge
fields:
- name: category
  type: categorical
  rule: exact_match
  options:
  - normal
  - elevated_no_signal
  - recession_signal
  target_derivation: |
    The Sahm-rule bucket of the sahm_value in the LATEST (highest observation_date) row of /root/timeseries.csv. Vocabulary is the fixed enum [normal, elevated_no_signal, recession_signal] derived from thresholds <0.30, 0.30-<0.50, >=0.50.
aggregation:
  method: mean
  pass_threshold: 0.8
