method: llm_judge
fields:
- name: layer_flock_yoy_phase
  type: categorical
  rule: exact_match
  options:
  - expansion
  - contraction
  - steady
  target_derivation: |
    Per-month US layer flock YoY phase, from the LATEST row of
    timeseries.csv and the row for the same month one year earlier,
    each at its latest known level (layers_revised_klb if filled,
    else layers_klb):
      yoy = (latest level - prior-year level) / prior-year level * 100
      if yoy >  +0.5: "expansion"
      if yoy <  -0.5: "contraction"
      else:           "steady"
aggregation:
  method: mean
  pass_threshold: 0.8
