method: llm_judge
fields:
- name: placements_yoy_class
  type: categorical
  rule: exact_match
  options:
  - above_prior_year
  - below_prior_year
  - equal_to_prior_year
  target_derivation: |
    Direction of YoY placements change: placements_million in the
    LATEST row of timeseries.csv vs the row 12 releases earlier (same
    data_month_name, one year before):
      higher -> above_prior_year
      lower  -> below_prior_year
      equal  -> equal_to_prior_year
    The target is the USDA headline direction ('7 percent below 2025'
    -> below_prior_year); format.py refuses to build an instance where
    the CSV comparison disagrees with it.
aggregation:
  method: mean
  pass_threshold: 0.8
