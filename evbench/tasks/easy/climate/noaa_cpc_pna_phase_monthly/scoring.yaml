method: llm_judge
fields:
- name: pna_phase
  type: categorical
  rule: exact_match
  options:
  - positive_phase
  - negative_phase
  - neutral
  target_derivation: |
    Per-month PNA phase, derived from the LATEST row of timeseries.csv:
      pna = pna_value
      if pna >= +0.5:   "positive_phase"
      elif pna <= -0.5: "negative_phase"
      else:             "neutral"
aggregation:
  method: mean
  pass_threshold: 0.8
