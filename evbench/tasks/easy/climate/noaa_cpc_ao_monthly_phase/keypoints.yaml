scenario_id: noaa_cpc_ao_monthly_phase
keypoints:
- id: kp_ao_phase
  description: Arctic Oscillation phase classification (Positive / Negative / Neutral) for the current
    month, per the ±0.5σ threshold rule on the monthly AO index.
  answer_field: ao_phase
  question_tag: A1
  verification_question: What is the AO phase for the current month?
  answer_type: enum
  enum_options:
  - Positive
  - Negative
  - Neutral
- id: kp_threshold_rationale
  description: Report acknowledges the ±0.5σ classification threshold (e.g. by citing the threshold or
    the numeric AO index alongside the band label).
  answer_field: null
  question_tag: A1
  verification_question: Does the report cite the ±0.5σ classification threshold or show the underlying
    AO index value?
  answer_type: boolean
faithfulness_sources:
  tier1_keypoints: true
  tier2_context:
  - csv_columns:
    - ao_value
    - derived_phase
    - period_label
  - prior_pdfs_glob: gt_source/*.pdf
  tier3_external: true
