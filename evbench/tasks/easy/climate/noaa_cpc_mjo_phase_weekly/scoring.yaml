method: llm_judge
fields:
- name: mjo_phase
  type: categorical
  rule: exact_match
  options:
  - weak
  - phase_1
  - phase_2
  - phase_3
  - phase_4
  - phase_5
  - phase_6
  - phase_7
  - phase_8
  target_derivation: |
    Per-week MJO Wheeler-Hendon phase from the LATEST row of
    timeseries.csv:
      amp = sqrt(rmm1^2 + rmm2^2)
      if amp < 1.0: 'weak'
      else: classify by Wheeler-Hendon phase sector
            (see session_brief.md for the full 8-sector rule).
aggregation:
  method: mean
  pass_threshold: 0.8
