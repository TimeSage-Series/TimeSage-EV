notes: |
  Easy-tier sign-based direction scenario. Single A3 (state.direction_tag)
  question: the week-over-week % change in site_wval against the prior
  MMWR week, with a +/-10% deadband (rising / falling / stable). The CSV
  carries site_wval only; the agent computes the change from the latest
  two rows. format.py's gt step derives the answer from exactly those
  rows and fails any instance without the prior week's row, so the first
  series week (2025-W47) is history only, not an instance.
  No tier-downgrade flag — natively A-group, matches Easy by design.
