# DeepSeek-V41-Flash as both agent and judge, on the self-hosted (spike) endpoint.
#
#   evsandbox sweep --config experiments/deepseek_v41_flash.yaml
#
# Needs in .env: SPIKE_API_KEY, plus the endpoint — SPIKE_BASE_URL, or a
# TIMESAGE_MODELS_CONFIG file naming DeepSeek-V41-Flash-1017-FP8.

target: deepseek-v41-flash

agent:
  name: smolagents_agent
  args:
    lm_provider: spike
    lm_model: DeepSeek-V41-Flash-1017-FP8

judge:
  backend: spike
  model: DeepSeek-V41-Flash-1017-FP8   # also used for the report-quality axis
  # DeepSeek-V4.1 reasons before answering; with reasoning on it can spend
  # the whole reply budget thinking and return nothing. Coverage, fact
  # extraction and quality are short classifications, so reasoning is off ...
  extra_body:
    chat_template_kwargs: {thinking: false}
  # ... except for fact-checking, which must recompute derived numbers
  # (a YoY %, a 12-month high) to tell a right one from a wrong one.
  by_kind:
    verify:
      extra_body: {reasoning_effort: low}
      max_tokens: 4096

isolation: bwrap
timeout: 300

tier: easy
mode: independent
strategies: [pass_through]
