# SearXNG discovery layer for the IATA scenario.
# Bound to localhost only — never expose this on a public interface.

services:
  searxng:
    image: searxng/searxng:2024.12.1-7be37c8e
    container_name: timesage_searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - BASE_URL=http://127.0.0.1:8888/
      - INSTANCE_NAME=timesage
    restart: unless-stopped
